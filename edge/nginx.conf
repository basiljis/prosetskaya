# Edge: always online. prosetskaya.ru -> app (SSR) with auto-maintenance; api.prosetskaya.ru -> backend proxy.
worker_processes auto;
events { worker_connections 2048; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile on;
  server_tokens off;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain text/xml;

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  # Artwork images live on the Lovable CDN path /__l5e/...; cache them locally.
  proxy_cache_path /var/cache/nginx/assets levels=1:2 keys_zone=assets:50m max_size=5g inactive=30d use_temp_path=off;

  upstream app_upstream { server app:3000 max_fails=2 fail_timeout=5s; keepalive 32; }

  # ---------- prosetskaya.ru / www ----------
  server {
    listen 8080 default_server;
    server_name prosetskaya.ru www.prosetskaya.ru;
    resolver 127.0.0.11 8.8.8.8 ipv6=off valid=10s;
    client_max_body_size 50m;

    if ($host = www.prosetskaya.ru) { return 301 https://prosetskaya.ru$request_uri; }

    location = /__edge_health { access_log off; add_header Content-Type text/plain; return 200 "ok"; }

    location = /maintenance.html {
      root /usr/share/nginx/maintenance;
      add_header Cache-Control "no-store, no-cache, must-revalidate" always;
      add_header Retry-After 900 always;
    }

    location /__l5e/ {
      set $cdn "prosetskaya.lovable.app";
      proxy_pass https://$cdn$request_uri;
      proxy_ssl_server_name on;
      proxy_ssl_name $cdn;
      proxy_set_header Host $cdn;
      proxy_cache assets;
      proxy_cache_valid 200 30d;
      proxy_cache_use_stale error timeout updating;
      proxy_ignore_headers Set-Cookie Cache-Control Expires;
      add_header Cache-Control "public, max-age=2592000, immutable" always;
      add_header X-Cache $upstream_cache_status always;
    }

    location / {
      # Manual maintenance: touch /etc/nginx/flags/maintenance.enabled ; bypass with ?bypass_maintenance=1
      set $maint 0;
      if (-f /etc/nginx/flags/maintenance.enabled) { set $maint 1; }
      if ($arg_bypass_maintenance = 1) { set $maint 0; }
      if ($maint = 1) { return 503; }

      proxy_pass http://app_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Connection "";
      proxy_connect_timeout 3s;
      proxy_read_timeout 60s;
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_intercept_errors on;
    }

    error_page 502 503 504 = @maintenance;
    location @maintenance {
      root /usr/share/nginx/maintenance;
      add_header Cache-Control "no-store, no-cache, must-revalidate" always;
      add_header Retry-After 900 always;
      rewrite ^ /maintenance.html break;
    }
  }

  # ---------- api.prosetskaya.ru -> backend ----------
  server {
    listen 8080;
    server_name api.prosetskaya.ru;

    resolver 8.8.8.8 1.1.1.1 ipv6=off valid=300s;
    resolver_timeout 10s;

    client_max_body_size 50m;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    set $cors_origin "";
    if ($http_origin ~* ^https?://(localhost(:[0-9]+)?|(www\.)?prosetskaya\.ru|.*\.lovable\.(app|dev))$) { set $cors_origin $http_origin; }

    location = /__edge_health { access_log off; return 200 "ok"; }

    location / {
      if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin      "$cors_origin" always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods     "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers     "authorization, apikey, content-type, x-client-info, x-supabase-api-version, range, prefer, accept-profile, content-profile, x-requested-with, x-upsert, cache-control" always;
        add_header Access-Control-Max-Age 86400 always;
        return 204;
      }

      set $supabase_upstream "oxqeowztnvhatzfivttk.supabase.co";
      proxy_pass https://$supabase_upstream$request_uri;
      proxy_ssl_server_name on;
      proxy_ssl_name $supabase_upstream;
      proxy_set_header Host $supabase_upstream;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

      proxy_http_version 1.1;
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      proxy_hide_header Access-Control-Allow-Origin;
      proxy_hide_header Access-Control-Allow-Credentials;
      proxy_hide_header Access-Control-Allow-Methods;
      proxy_hide_header Access-Control-Allow-Headers;
      proxy_hide_header Access-Control-Expose-Headers;
      proxy_hide_header Access-Control-Max-Age;

      add_header Access-Control-Allow-Origin      "$cors_origin" always;
      add_header Access-Control-Allow-Credentials "true" always;
      add_header Access-Control-Expose-Headers    "content-range, x-supabase-api-version, content-length" always;
      add_header Cache-Control "no-store" always;
    }
  }
}
