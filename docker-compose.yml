services:
  edge:
    build: ./edge
    ports:
      - "8082:8080"
    depends_on:
      - app
    volumes:
      - maintenance_flags:/etc/nginx/flags
    restart: always

  app:
    build:
      context: .
      args:
        VITE_EXTERNAL_SUPABASE_URL: ${VITE_EXTERNAL_SUPABASE_URL:-https://api.prosetskaya.ru}
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-https://api.prosetskaya.ru}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
        VITE_SUPABASE_PROJECT_ID: ${VITE_SUPABASE_PROJECT_ID:-pgssrcadvcwxmvuhfozu}
    expose:
      - "3000"
    environment:
      # Server-side code calls the backend directly (outgoing traffic from RU servers is not blocked).
      SUPABASE_URL: https://pgssrcadvcwxmvuhfozu.supabase.co
      SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
      EXTERNAL_SUPABASE_SECRET_KEY: ${EXTERNAL_SUPABASE_SECRET_KEY:-}
    restart: always

volumes:
  maintenance_flags:
